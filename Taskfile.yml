version: '3'

dotenv: ['.env']

vars:
  BINARY: lumi
  PKG: ./cmd/lumi

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  speech:
    desc: Compile the Swift SpeechAnalyzer bridge into a static archive
    platforms: [darwin]
    sources:
      - internal/macosnative/speech.swift
    generates:
      - internal/macosnative/liblumispeech.a
    cmds:
      - swiftc -emit-library -static -O -o internal/macosnative/liblumispeech.a internal/macosnative/speech.swift

  build:
    desc: Build the lumi binary
    deps: [speech]
    sources:
      - '**/*.go'
      - '**/*.m'
      - internal/macosnative/liblumispeech.a
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'
    cmds:
      - go build -o {{.BINARY}} {{.PKG}}

  install:
    desc: Install the lumi binary system-wide into the Go bin directory
    deps: [speech]
    vars:
      GOBIN:
        sh: go env GOBIN || true
      GOPATH:
        sh: go env GOPATH
    cmds:
      - go install {{.PKG}}
      - 'echo "installed lumi to {{if .GOBIN}}{{.GOBIN}}{{else}}{{.GOPATH}}/bin{{end}}"'

  uninstall:
    desc: Remove the installed lumi binary from the Go bin directory
    vars:
      GOBIN:
        sh: go env GOBIN || true
      GOPATH:
        sh: go env GOPATH
    cmds:
      - rm -f {{if .GOBIN}}{{.GOBIN}}{{else}}{{.GOPATH}}/bin{{end}}/{{.BINARY}}

  test:
    desc: Run all tests
    deps: [speech]
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test:v:
    desc: Run all tests with verbose output
    deps: [speech]
    cmds:
      - go test -v ./... {{.CLI_ARGS}}

  test:native:
    desc: Run the permission-gated ScreenCaptureKit, Accessibility, Vision, and audio smoke test
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: Native capture requires an Apple Silicon Mac
    deps: [build]
    cmds:
      - ./{{.BINARY}} native-smoke

  bench:capture:
    desc: Benchmark perceptual frame comparison
    deps: [speech]
    cmds:
      - go test ./internal/capture -run '^$' -bench 'Benchmark(SampledHistogram|FrameComparerExactDuplicate)' -benchmem -count=1

  test:one:
    desc: 'Run a single test (e.g. task test:one -- -run TestSearch ./internal/store)'
    deps: [speech]
    cmds:
      - go test -v {{.CLI_ARGS}}

  cover:
    desc: Run tests with a coverage report
    deps: [speech]
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  cover:html:
    desc: Open the HTML coverage report
    deps: [cover]
    cmds:
      - go tool cover -html=coverage.out

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go source
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  check:
    desc: Format, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  clean:
    desc: Remove build artifacts and coverage output
    cmds:
      - rm -f {{.BINARY}} coverage.out internal/macosnative/liblumispeech.a

  doctor:
    desc: Report native permissions, speech assets, and the data directory
    deps: [build]
    cmds:
      - ./{{.BINARY}} doctor

  permissions:
    desc: Request native macOS capture permissions for the stable Lumi binary
    platforms: [darwin]
    deps: [build]
    interactive: true
    cmds:
      - ./{{.BINARY}} permissions --request {{.CLI_ARGS}}

  record:
    desc: 'Capture screen + audio (e.g. task record -- --no-audio --duration 10s)'
    platforms: [darwin]
    deps: [build]
    interactive: true
    cmds:
      - ./{{.BINARY}} record {{.CLI_ARGS}}

  smoke:
    desc: Bounded 10s screen-only capture smoke test
    platforms: [darwin]
    deps: [build]
    cmds:
      - ./{{.BINARY}} record --no-audio --duration 10s

  search:
    desc: 'Search captured events (e.g. task search -- "invoice")'
    deps: [build]
    cmds:
      - ./{{.BINARY}} search {{.CLI_ARGS}}

  version:
    desc: Print the Lumi version
    deps: [build]
    cmds:
      - ./{{.BINARY}} version
