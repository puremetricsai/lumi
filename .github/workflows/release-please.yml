name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Lumi is darwin/arm64 only: cgo links ScreenCaptureKit, Vision, AVFoundation and a
  # static Swift archive built against the macOS 26 SDK. There is exactly one target and
  # no cross-compilation is possible, so this job runs on an Apple Silicon macOS 26 runner.
  build-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Select a macOS 26 SDK toolchain
        run: |
          # SpeechAnalyzer exists only in the macOS 26 SDK. Pin Xcode when the expected
          # version is present, then assert the SDK version so an image bump that changes
          # the default toolchain fails here instead of inside swiftc.
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK ${SDK_VERSION}"
          # Compare the major numerically rather than enumerating majors: an allowlist
          # rejects a future SDK that satisfies the rule this message states, and
          # build-binaries is the only job gated on release_created, so failing here
          # leaves a tag and a GitHub release with no assets attached.
          SDK_MAJOR="${SDK_VERSION%%.*}"
          case "${SDK_MAJOR}" in
            ''|*[!0-9]*) echo "::error::could not parse a major version out of the macOS SDK version '${SDK_VERSION}'"; exit 1 ;;
          esac
          [ "${SDK_MAJOR}" -ge 26 ] || { echo "::error::the SpeechAnalyzer bridge needs the macOS 26 SDK or newer (found ${SDK_VERSION})"; exit 1; }
      - name: Build binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          # Same ordering as Taskfile.yml: the static Swift archive must exist before cgo
          # runs, because internal/macosnative links -L${SRCDIR} -llumispeech.
          swiftc -emit-library -static -O \
            -o internal/macosnative/liblumispeech.a \
            internal/macosnative/speech.swift
          LDFLAGS="-s -w -X github.com/puremetricsai/lumi/internal/cli.version=${VERSION}"
          go build -ldflags="${LDFLAGS}" -o lumi ./cmd/lumi
      - name: Verify the injected version
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          # -X silently no-ops against a Go const, so assert the binary really reports the
          # tag rather than the 0.1.0-dev default.
          ACTUAL="$(./lumi version)"
          [ "${ACTUAL}" = "${TAG}" ] || { echo "::error::lumi version printed '${ACTUAL}', expected '${TAG}'"; exit 1; }
      # The binary is not published on its own. Lumi.app is the whole product, and
      # this build is its engine: it is embedded in the bundle below rather than
      # shipped beside it.
      #
      # Lumi.app is built around the binary the steps above produced and verified,
      # never around a second one: the app and the binary it embeds are one version
      # by construction, not by two builds agreeing.
      - name: Import the release signing identity
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
        run: |
          set -euo pipefail
          # A secret cannot be read in a job- or step-level `if:`, so the branch lives
          # in the script. With no certificate configured the release still ships and
          # the bundle is ad-hoc signed; docs/release.md is what that costs the people
          # installing it, and why it should be configured before the first cask
          # release rather than after.
          if [ -z "${P12_BASE64}" ]; then
            # Before the cask exists, an ad-hoc bundle reaches nobody and the release
            # ships. Once it exists it does reach people, and README.md tells them their
            # Gatekeeper approval and TCC grants survive upgrades — which is true of a
            # stable certificate and false of an ad-hoc signature, whose designated
            # requirement is a fresh hash every build. So the promise is enforced where
            # it is made rather than left to a maintainer remembering docs/release.md.
            if [ -f Casks/lumi.rb ]; then
              echo "::error::Casks/lumi.rb ships Lumi.app to users, but no signing certificate is configured. Set MACOS_DEVELOPER_ID_P12_BASE64, MACOS_DEVELOPER_ID_P12_PASSWORD and MACOS_DEVELOPER_IDENTITY (docs/release.md), or an ad-hoc release will cost every user their permissions."
              exit 1
            fi
            echo "::warning::no signing certificate configured; Lumi.app will be ad-hoc signed"
            exit 0
          fi
          [ -n "${IDENTITY}" ] || { echo "::error::MACOS_DEVELOPER_ID_P12_BASE64 is set but MACOS_DEVELOPER_IDENTITY is not"; exit 1; }
          KEYCHAIN="${RUNNER_TEMP}/lumi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          # Default settings re-lock the keychain after five idle minutes, in the
          # middle of a build that takes longer than that.
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${KEYCHAIN}" \
            -P "${P12_PASSWORD}" -T /usr/bin/codesign -f pkcs12
          rm -f "${RUNNER_TEMP}/certificate.p12"
          # Without a partition list codesign blocks on a GUI prompt no one can answer,
          # and the job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          # Prepend rather than replace: dropping the login keychain off the search
          # list takes every other credential on the runner with it.
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          # No `-v`. A self-signed certificate is untrusted, so `find-identity -v`
          # reports "0 valid identities found" for a keychain codesign then signs with
          # perfectly well — measured on macOS 26.5.2. Gating a release on `-v` would
          # fail every run that uses the interim certificate. This lists and counts
          # without asserting, and without printing the certificate itself.
          security find-identity -p codesigning "${KEYCHAIN}" | tail -2

      - name: Build Lumi.app
        env:
          # Empty when no identity is configured, which build-app.sh resolves to
          # ad-hoc — the same path `task app` takes locally.
          CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
        run: ./macos/build-app.sh

      - name: Verify Lumi.app
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          APP=build/Lumi.app
          # The bundle states the version twice and both must agree with the tag, in
          # the two spellings that are correct for them: the CLI prints the tag it was
          # linked with, and CFBundleShortVersionString is that tag without its `v`,
          # which is also what the cask's `version` field carries.
          ACTUAL="$("${APP}/Contents/MacOS/lumi" version)"
          [ "${ACTUAL}" = "${TAG}" ] || { echo "::error::the embedded lumi reports '${ACTUAL}', expected '${TAG}'"; exit 1; }
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")"
          [ "${SHORT}" = "${TAG#v}" ] || { echo "::error::CFBundleShortVersionString is '${SHORT}', expected '${TAG#v}'"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${APP}"
          lipo "${APP}/Contents/MacOS/LumiApp" -verify_arch arm64
          lipo "${APP}/Contents/MacOS/lumi" -verify_arch arm64
          # Notarization, stapling, `stapler validate`, `spctl --assess`, and the
          # assertion that the authority is a Developer ID all wait on a certificate
          # that does not exist yet. Each of them fails by design on an un-notarized
          # bundle, so running them here would fail every release rather than report
          # anything. .claude/commands/lumi-developer-id-signing.md restores them.
          codesign -dvvv "${APP}" 2>&1 | grep -E 'Identifier=|Signature=|Authority=' || true

      # ditto, not zip: it preserves the extended attributes, symlinks, and resource
      # forks a signed bundle is sealed over, and --keepParent keeps Lumi.app itself
      # as the archive's top-level entry, which is what the cask's `app` stanza names.
      - name: Archive Lumi.app
        run: /usr/bin/ditto -c -k --keepParent build/Lumi.app lumi-macos-arm64.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lumi-macos-arm64.zip
          path: lumi-macos-arm64.zip
          retention-days: 1

      - name: Delete the temporary keychain
        if: always()
        run: |
          # delete-keychain also takes it off the search list, so there is nothing to
          # restore. Both paths are removed unconditionally: this step runs after a
          # failure too, and that is the run most likely to have left them behind.
          security delete-keychain "${RUNNER_TEMP}/lumi-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/lumi-signing.keychain-db" "${RUNNER_TEMP}/certificate.p12"

  upload-release-assets:
    needs: [release-please, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          # Without this the on-disk layout depends on how many artifacts the run
          # produced: download-artifact nests each one under a directory named after it,
          # except when exactly one artifact matched, which it drops flat into `path` --
          # while still logging "an extra directory with the artifact name will be
          # created". There is one artifact today, so the nested layout this job used to
          # assume never existed. `merge-multiple: true` is flat unconditionally, so
          # adding a second archive later cannot move the files out from under the glob.
          merge-multiple: true
      - name: Generate checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          cd artifacts
          # Named, not globbed. A glob cannot tell "the app job produced nothing" from
          # "there is nothing to produce" -- it would publish an assetless release and
          # call it a success. This name is what verify-release checks for and what
          # SHA256SUMS.txt lists; update-homebrew-packages looks the zip up in it.
          # The list is one entry because Lumi.app is the whole product: the binary it
          # embeds is not published separately.
          ARCHIVES=(lumi-macos-arm64.zip)
          for file in "${ARCHIVES[@]}"; do
            [ -f "$file" ] || { echo "::error::build-binaries produced no ${file}"; ls -R; exit 1; }
          done
          # Hashing the bare names rather than a `find` path keeps the names in
          # SHA256SUMS.txt relative and unprefixed, which is what `sha256sum -c` in
          # verify-release needs: it resolves every name against its own cwd, and what
          # update-homebrew-packages' `awk '$2 == f'` lookup needs, which matches a bare
          # filename and silently yields nothing for a prefixed one.
          sha256sum "${ARCHIVES[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if grep -qvE '^[0-9a-f]{64}  [^/]+$' SHA256SUMS.txt; then
            echo "::error::SHA256SUMS.txt is malformed"
            exit 1
          fi
          for file in "${ARCHIVES[@]}"; do
            gh release upload "$TAG" "$file" --clobber --repo ${{ github.repository }}
          done
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo ${{ github.repository }}

  verify-release:
    needs: [release-please, upload-release-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' --repo ${{ github.repository }})
          for asset in lumi-macos-arm64.zip SHA256SUMS.txt; do
            echo "$ASSETS" | grep -q "^${asset}$" && echo "✓ $asset" || { echo "✗ Missing: $asset"; exit 1; }
          done

      - name: Verify published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          # Checking asset names cannot see a SHA256SUMS.txt whose hashes were mangled on
          # the way in, which is how this pipeline shipped unverifiable checksums before.
          # Download what users download and run the command they would run.
          mkdir -p verify
          cd verify
          gh release download "$TAG" --clobber --repo ${{ github.repository }}
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

  # Linux can prove the published bytes are the bytes that were built. Only macOS
  # can prove they are a bundle it will run, and a cask installs a bundle. So this
  # repeats the build-time assertions against what a user actually downloads.
  verify-macos-app:
    needs: [release-please, upload-release-assets]
    runs-on: macos-26
    steps:
      - name: Verify the published app bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p appcheck
          cd appcheck
          gh release download "$TAG" --clobber --repo ${{ github.repository }} \
            --pattern lumi-macos-arm64.zip
          # ditto both ways. `unzip` drops the extended attributes and resource forks
          # the signature is sealed over, so it can fail a bundle that is in fact
          # intact -- and this step's whole job is to tell those two apart.
          /usr/bin/ditto -x -k lumi-macos-arm64.zip .
          APP=Lumi.app
          ACTUAL="$("${APP}/Contents/MacOS/lumi" version)"
          [ "${ACTUAL}" = "${TAG}" ] || { echo "::error::the published app's lumi reports '${ACTUAL}', expected '${TAG}'"; exit 1; }
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")"
          [ "${SHORT}" = "${TAG#v}" ] || { echo "::error::the published app's CFBundleShortVersionString is '${SHORT}', expected '${TAG#v}'"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${APP}"
          lipo "${APP}/Contents/MacOS/LumiApp" -verify_arch arm64
          lipo "${APP}/Contents/MacOS/lumi" -verify_arch arm64
          # `xcrun stapler validate` and `spctl --assess --type execute` belong here and
          # are absent for one reason: there is no notarization ticket to staple yet, so
          # both fail by design rather than reporting anything.
          # .claude/commands/lumi-developer-id-signing.md restores them with the
          # certificate.
          codesign -dvvv "${APP}" 2>&1 | grep -E 'Identifier=|Signature=|Authority=' || true

  update-homebrew-packages:
    # The cask names a release asset, so it may not be rewritten before that asset
    # exists: a tap pointing at a 404 breaks every `brew install --cask`, while a tap
    # still pointing at the previous release keeps working.
    #
    # A failed release must therefore leave the tap alone rather than advance it — that
    # is the intent, not a side effect to engineer around. Fixing the release, or
    # re-running it for a transient failure, is the developer's job; nothing here should
    # try to publish a package definition around a build that did not produce a binary.
    #
    # The recovery is worth writing down because it is not obvious. Job 1 cuts the tag
    # before build-binaries runs, and release-please will not re-cut a version whose
    # release already exists, so a *fresh* run (a new push to main, or workflow_dispatch)
    # sets release_created to false and skips this job. Use GitHub's "Re-run failed jobs"
    # on the *same* run instead — that reuses the completed release-please job's outputs,
    # so release_created stays true and tag_name persists, and the cascade re-runs from
    # the failed job forward.
    #
    # Both verification jobs are barriers, not just upload-release-assets. A bundle that
    # fails `codesign --verify` after download is a release users must not be pointed at,
    # and only verify-macos-app can see that.
    needs: [release-please, upload-release-assets, verify-release, verify-macos-app]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lumi repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          token: ${{ github.token }}
          # The push step below rebases onto whatever main has become. A shallow
          # clone has no merge base to rebase against once main moves, so the
          # rebase fails exactly in the race it exists to survive.
          fetch-depth: 0

      - name: Compute release asset SHA256s
        id: sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          # Download outside the checkout. The commit-and-push step below runs in this same
          # working tree, and a stray archive there is one `git add -A` away from being
          # committed.
          WORK="${RUNNER_TEMP}/release-assets"
          rm -rf "$WORK"
          # Stay in the checkout and address the downloads absolutely, rather than cd-ing
          # into a directory this step then deletes out from under itself.
          gh release download "$TAG" --repo "${{ github.repository }}" --clobber \
            --dir "$WORK" \
            --pattern lumi-macos-arm64.zip \
            --pattern SHA256SUMS.txt
          # Sets SHA. Hash the bytes brew will download rather than trusting the published
          # list, then cross-check against what the release publishes for the same file.
          # The hashed value is not in doubt — those are the bytes brew will download. What
          # a disagreement means is that the release contradicts itself, and a release whose
          # own manifest does not describe its own asset is not one to point users at.
          #
          # `$2` is the bare filename because upload-release-assets already asserts the
          # manifest is two-space, text-mode and unprefixed (`^[0-9a-f]{64}  [^/]+$`), which
          # rejects binary-mode `*name` and any path. That guard and this awk are a pair, and
          # so is the named-asset list there: a filename absent from the manifest yields an
          # empty PUBLISHED — awk still exits 0, so `set -e` does not fire and this
          # comparison is what catches it.
          #
          # Not a command substitution: `exit 1` inside `$( )` leaves the subshell, and the
          # assignment around it succeeds, so a mismatch would be reported and then ignored.
          hash_asset() {
            local asset="$1" published
            SHA="$(sha256sum "${WORK}/${asset}" | awk '{print $1}')"
            [ "${#SHA}" -eq 64 ] || { echo "::error::bad ${asset} sha256: '${SHA}'"; exit 1; }
            published="$(awk -v f="$asset" '$2 == f {print $1}' "${WORK}/SHA256SUMS.txt")"
            [ "$published" = "$SHA" ] || { echo "::error::SHA256SUMS.txt records '${published}' for ${asset}, but the asset hashes to '${SHA}'"; exit 1; }
          }
          # Prove the file is really the container it claims to be before hashing it.
          unzip -qt "${WORK}/lumi-macos-arm64.zip"
          hash_asset lumi-macos-arm64.zip
          echo "app=${SHA}" >> "$GITHUB_OUTPUT"
          rm -rf "$WORK"

      - name: Update the cask
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          CASK="Casks/lumi.rb"

          # The cask is the only Homebrew package Lumi ships. It carries the menu-bar app
          # and the `lumi` CLI the app embeds, so a missing cask is a broken release, not
          # a step to skip.
          [ -f "$CASK" ] || { echo "::error::${CASK} does not exist; there is no package to point at ${TAG}"; exit 1; }

          # Rewrite the one `<field> "<value>"` line in the cask, and prove afterwards
          # that the line now reads exactly what it should.
          #
          # Anchored at both ends, and at *exactly two spaces* of indent. Every part of
          # that matters:
          #
          #   - Without the trailing `$` these match the *prefix* of a line such as
          #     `url "...", branch: "main"` and rewrite it while leaving its trailing
          #     arguments attached — and every check below still reports success.
          #   - `[^"]*` keeps them off such a line for the same reason.
          #   - `^  ` rather than `^ *` is what makes "top-level" mean it. A field nested
          #     inside an `on_arm do` block is indented four, so `^ *` would count 1,
          #     rewrite the nested one, satisfy the postcondition, and pass `ruby -c` —
          #     publishing a cask whose top-level field still names the previous release.
          #     At two spaces that file fails the count guard instead.
          #
          # The count guard runs first because sed rewrites in place and cannot insert, so
          # a file that lost the line entirely must fail rather than silently ship the
          # previous release's asset under the new tag.
          #
          # The seds use `|` as their delimiter unescaped, so a value containing `|`,
          # `&`, or a backslash would corrupt the substitution. Every value passed here
          # is a dotted version or a hex digest; neither can.
          #
          # `expect_line` is separate because the cask's `url` is asserted but never
          # rewritten. `git diff --cached --quiet` below cannot tell "already correct"
          # from "matched nothing", which is why the assertion exists at all, and it is a
          # whole-line match because a substring one accepts `...zip-old` and text in a
          # comment.
          expect_line() {
            grep -qxF -- "  $2" "$1" \
              || { echo "::error::$1 has no line \`  $2\`"; exit 1; }
          }
          rewrite() {
            local file="$1" field="$2" value="$3" count
            count="$(grep -cE "^  ${field} \"[^\"]*\"$" "$file" || true)"
            [ "${count}" = "1" ] || { echo "::error::${file} has ${count} top-level \`${field} \"...\"\` lines, expected exactly 1"; exit 1; }
            sed -i -E "s|^  ${field} \"[^\"]*\"$|  ${field} \"${value}\"|" "$file"
            expect_line "$file" "${field} \"${value}\""
          }

          rewrite "$CASK" version "${VERSION}"
          rewrite "$CASK" sha256 "${{ steps.sha256.outputs.app }}"
          # The cask names the tag through `v#{version}`, so its url line is never
          # rewritten and must never match the `url` guard above — which it would,
          # harmlessly, if this ever called `rewrite "$CASK" url ...`. It does not.
          # Assert instead that the url still resolves to this tag through the version
          # that was just written. Rewriting `version` is what moves the cask's download;
          # if that interpolation is ever flattened to a literal, this job goes on
          # reporting success while the cask serves the previous release forever.
          expect_line "$CASK" 'url "https://github.com/${{ github.repository }}/releases/download/v#{version}/lumi-macos-arm64.zip"'
          [ "v${VERSION}" = "${TAG}" ] || { echo "::error::v${VERSION} is not the release tag ${TAG}"; exit 1; }
          # Ruby parses the file, which is the check that catches a value with a quote or
          # a backslash in it. `brew audit --cask --strict` is the fuller check and is a
          # macOS-only, maintainer-run step — casks cannot be audited on Linux, and
          # `--signing`/`--new` must not be used while the bundle is un-notarized.
          ruby -c "$CASK" >/dev/null
          cat "$CASK"

      - name: Commit and push
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lumi.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update Homebrew cask to ${VERSION}"
          # main can move underneath us between the checkout and here; rebase rather than
          # fail the release on a non-fast-forward push.
          git pull --rebase origin main
          git push
