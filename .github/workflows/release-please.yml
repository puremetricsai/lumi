name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Lumi is darwin/arm64 only: cgo links ScreenCaptureKit, Vision, AVFoundation and a
  # static Swift archive built against the macOS 26 SDK. There is exactly one target and
  # no cross-compilation is possible, so this job runs on an Apple Silicon macOS 26 runner.
  build-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Select a macOS 26 SDK toolchain
        run: |
          # SpeechAnalyzer exists only in the macOS 26 SDK. Pin Xcode when the expected
          # version is present, then assert the SDK version so an image bump that changes
          # the default toolchain fails here instead of inside swiftc.
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK ${SDK_VERSION}"
          # Compare the major numerically rather than enumerating majors: an allowlist
          # rejects a future SDK that satisfies the rule this message states, and
          # build-binaries is the only job gated on release_created, so failing here
          # leaves a tag and a GitHub release with no assets attached.
          SDK_MAJOR="${SDK_VERSION%%.*}"
          case "${SDK_MAJOR}" in
            ''|*[!0-9]*) echo "::error::could not parse a major version out of the macOS SDK version '${SDK_VERSION}'"; exit 1 ;;
          esac
          [ "${SDK_MAJOR}" -ge 26 ] || { echo "::error::the SpeechAnalyzer bridge needs the macOS 26 SDK or newer (found ${SDK_VERSION})"; exit 1; }
      - name: Build binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          # Same ordering as Taskfile.yml: the static Swift archive must exist before cgo
          # runs, because internal/macosnative links -L${SRCDIR} -llumispeech.
          swiftc -emit-library -static -O \
            -o internal/macosnative/liblumispeech.a \
            internal/macosnative/speech.swift
          LDFLAGS="-s -w -X github.com/puremetricsai/lumi/internal/cli.version=${VERSION}"
          go build -ldflags="${LDFLAGS}" -o lumi ./cmd/lumi
      - name: Verify the injected version
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          # -X silently no-ops against a Go const, so assert the binary really reports the
          # tag rather than the 0.1.0-dev default.
          ACTUAL="$(./lumi version)"
          [ "${ACTUAL}" = "${TAG}" ] || { echo "::error::lumi version printed '${ACTUAL}', expected '${TAG}'"; exit 1; }
      - name: Archive binary
        run: tar -czf lumi-darwin-arm64.tar.gz lumi LICENSE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lumi-darwin-arm64.tar.gz
          path: lumi-darwin-arm64.tar.gz
          retention-days: 1

  upload-release-assets:
    needs: [release-please, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          # Without this the on-disk layout depends on how many artifacts the run
          # produced: download-artifact nests each one under a directory named after it,
          # except when exactly one artifact matched, which it drops flat into `path` --
          # while still logging "an extra directory with the artifact name will be
          # created". There is one artifact today, so the nested layout this job used to
          # assume never existed. `merge-multiple: true` is flat unconditionally, so
          # adding a second archive later cannot move the files out from under the glob.
          merge-multiple: true
      - name: Generate checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          cd artifacts
          # nullglob so a missing archive is caught by the count below with a message
          # naming the job that should have produced it, not by sha256sum failing on a
          # file literally called '*.tar.gz'.
          shopt -s nullglob
          ARCHIVES=(*.tar.gz)
          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "::error::build-binaries produced no *.tar.gz archive"
            ls -R
            exit 1
          fi
          # Hashing the bare glob rather than a `find` path keeps the names in
          # SHA256SUMS.txt relative and unprefixed, which is what `sha256sum -c` in
          # verify-release needs: it resolves every name against its own cwd.
          sha256sum "${ARCHIVES[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if grep -qvE '^[0-9a-f]{64}  [^/]+$' SHA256SUMS.txt; then
            echo "::error::SHA256SUMS.txt is malformed"
            exit 1
          fi
          for file in "${ARCHIVES[@]}"; do
            gh release upload "$TAG" "$file" --clobber --repo ${{ github.repository }}
          done
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo ${{ github.repository }}

  verify-release:
    needs: [release-please, upload-release-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' --repo ${{ github.repository }})
          for asset in lumi-darwin-arm64.tar.gz SHA256SUMS.txt; do
            echo "$ASSETS" | grep -q "^${asset}$" && echo "✓ $asset" || { echo "✗ Missing: $asset"; exit 1; }
          done

      - name: Verify published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          # Checking asset names cannot see a SHA256SUMS.txt whose hashes were mangled on
          # the way in, which is how this pipeline shipped unverifiable checksums before.
          # Download what users download and run the command they would run.
          mkdir -p verify
          cd verify
          gh release download "$TAG" --clobber --repo ${{ github.repository }}
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

  update-homebrew-formula:
    # The formula names a release asset now, so it must not be rewritten before that asset
    # exists: a tap pointing at a 404 breaks every `brew install`, while a tap still
    # pointing at the previous release keeps working. That inverts the ordering this job
    # used to have, back when the formula built from source and consumed nothing the other
    # jobs produced.
    #
    # A failed release must therefore leave the tap alone rather than advance it — that is
    # the intent, not a side effect to engineer around. Fixing the release, or re-running it
    # for a transient failure, is the developer's job; nothing here should try to publish a
    # formula around a build that did not produce a binary.
    #
    # The recovery is worth writing down because it is not obvious. Job 1 cuts the tag before
    # build-binaries runs, and release-please will not re-cut a version whose release already
    # exists, so a *fresh* run (a new push to main, or workflow_dispatch) sets release_created
    # to false and skips this job. Use GitHub's "Re-run failed jobs" on the *same* run
    # instead — that reuses the completed release-please job's outputs, so release_created
    # stays true and tag_name persists, and the cascade re-runs from the failed job forward.
    #
    # upload-release-assets is a sufficient barrier only because the sha256 step below
    # downloads the asset and hashes the bytes itself. If that is ever reduced to reading
    # the hash out of SHA256SUMS.txt, this job stops verifying its own input and the
    # barrier has to move to verify-release.
    needs: [release-please, upload-release-assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lumi repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          token: ${{ github.token }}
          # The push step below rebases onto whatever main has become. A shallow
          # clone has no merge base to rebase against once main moves, so the
          # rebase fails exactly in the race it exists to survive.
          fetch-depth: 0

      - name: Compute release archive SHA256
        id: sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ARCHIVE="lumi-darwin-arm64.tar.gz"
          # Download outside the checkout. The commit-and-push step below runs in this same
          # working tree, and a stray 4MB archive there is one `git add -A` away from being
          # committed.
          WORK="${RUNNER_TEMP}/formula-asset"
          rm -rf "$WORK"
          # Stay in the checkout and address the downloads absolutely, rather than cd-ing
          # into a directory this step then deletes out from under itself.
          gh release download "$TAG" --repo "${{ github.repository }}" --clobber \
            --dir "$WORK" --pattern "$ARCHIVE" --pattern SHA256SUMS.txt
          # Hash the bytes brew will download rather than trusting the published list, and
          # prove they are really a gzip stream first.
          gzip -t "${WORK}/${ARCHIVE}"
          SHA256="$(sha256sum "${WORK}/${ARCHIVE}" | awk '{print $1}')"
          [ "${#SHA256}" -eq 64 ] || { echo "::error::bad ${ARCHIVE} sha256: '${SHA256}'"; exit 1; }
          # Then cross-check it against what the release publishes for the same file. The
          # hashed value is not in doubt — those are the bytes brew will download. What a
          # disagreement means is that the release contradicts itself, and a release whose
          # own manifest does not describe its own asset is not one to point users at;
          # verify-release is failing on this same run for the same reason.
          #
          # `$2` is the bare filename because upload-release-assets already asserts the
          # manifest is two-space, text-mode and unprefixed (`^[0-9a-f]{64}  [^/]+$`), which
          # rejects binary-mode `*name` and any path. That guard and this awk are a pair.
          # A filename absent from the manifest yields an empty PUBLISHED — awk still exits
          # 0, so `set -e` does not fire and this comparison is what catches it.
          PUBLISHED="$(awk -v f="$ARCHIVE" '$2 == f {print $1}' "${WORK}/SHA256SUMS.txt")"
          [ "$PUBLISHED" = "$SHA256" ] || { echo "::error::SHA256SUMS.txt records '${PUBLISHED}' for ${ARCHIVE}, but the asset hashes to '${SHA256}'"; exit 1; }
          rm -rf "$WORK"
          echo "archive=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          FORMULA="HomebrewFormula/lumi.rb"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/lumi-darwin-arm64.tar.gz"
          SHA256="${{ steps.sha256.outputs.archive }}"
          # These seds rewrite in place and cannot insert, so the formula must hold exactly
          # one top-level `url`/`sha256` pair. A `resource`, `stable do`, or `head do` block
          # would give them a second, wrong target; `^ *` and `[^"]*` keep them off a line
          # like `url "...", tag: "...", revision: "..."`, which a greedy `.*` would collapse.
          for field in url sha256; do
            COUNT="$(grep -cE "^ *${field} \"[^\"]*\"$" "$FORMULA" || true)"
            [ "${COUNT}" = "1" ] || { echo "::error::${FORMULA} has ${COUNT} top-level \`${field} \"...\"\` lines, expected exactly 1"; exit 1; }
          done
          # Anchored at both ends, exactly like the guard above. Without the trailing `$`
          # these match the *prefix* of a line such as `url "...", branch: "main"` and
          # rewrite it in place while leaving its trailing arguments attached — and the
          # guard still counts 1, and the postconditions below still pass, so every check
          # in this step reports success over a corrupted formula.
          sed -i -E "s|^( *)url \"[^\"]*\"\$|\1url \"${URL}\"|" "$FORMULA"
          sed -i -E "s|^( *)sha256 \"[^\"]*\"\$|\1sha256 \"${SHA256}\"|" "$FORMULA"
          # Assert the postcondition. `git diff --cached --quiet` below cannot tell "already
          # correct" from "matched nothing", so without this a missed regex is a green job
          # that ships the previous release's archive under the new tag. Compare whole
          # lines, indentation stripped: a substring match would also accept a line the
          # unanchored seds above had left trailing arguments on.
          for expected in "url \"${URL}\"" "sha256 \"${SHA256}\""; do
            sed -E 's|^ +||' "$FORMULA" | grep -qxF -- "$expected" \
              || { echo "::error::${FORMULA} has no line \`${expected}\` after the rewrite"; exit 1; }
          done
          cat "$FORMULA"

      - name: Commit and push
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/lumi.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update Homebrew formula to ${VERSION}"
          # main can move underneath us between the checkout and here; rebase rather than
          # fail the release on a non-fast-forward push.
          git pull --rebase origin main
          git push
